<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ROA — Red de Orientación Administrativa | Santa Fe Capital</title>
    <meta
      name="description"
      content="Plataforma comunitaria de transparencia académica en Santa Fe Capital: directorio de instituciones, planes de estudio, relevamiento edilicio, emprendimientos y ayudas de estudio."
    />
    <meta property="og:title" content="ROA — Red de Orientación Administrativa" />
    <meta
      property="og:description"
      content="Información académica verificable, trazabilidad de fuentes y orientación para ingresantes en Santa Fe Capital."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Inicialización temprana del tema para evitar parpadeos al cargar -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('roa-theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 dark:bg-[#0B1120] dark:text-slate-100 antialiased selection:bg-sky-100 selection:text-slate-900 dark:selection:bg-sky-900 dark:selection:text-slate-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
